<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="seal-bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3AA6A6"/>
      <stop offset="1" stop-color="#1C6060"/>
    </linearGradient>
  </defs>

  <!-- Ocean Depths: badge -->
  <rect width="512" height="512" rx="116" fill="url(#seal-bg)"/>

  <!-- stamp perforation ring (Seafoam) -->
  <circle cx="256" cy="256" r="152" fill="none" stroke="#A8DADC" stroke-width="16" stroke-linecap="round" stroke-dasharray="1 30" opacity="0.9"/>

  <!-- clock face (Cream) -->
  <circle cx="256" cy="256" r="118" fill="#F1FAEE"/>

  <!-- hour ticks (Teal) -->
  <g stroke="#2D8B8B" stroke-width="14" stroke-linecap="round">
    <line x1="256" y1="148" x2="256" y2="170"/>
    <line x1="364" y1="256" x2="342" y2="256"/>
    <line x1="256" y1="364" x2="256" y2="342"/>
    <line x1="148" y1="256" x2="170" y2="256"/>
  </g>

  <!-- hands + pin (Deep Navy) -->
  <g stroke="#1A2332" stroke-linecap="round">
    <line x1="256" y1="256" x2="256" y2="188" stroke-width="22"/>
    <line x1="256" y1="256" x2="344" y2="256" stroke-width="22"/>
  </g>
  <circle cx="256" cy="256" r="17" fill="#1A2332"/>
</svg>
